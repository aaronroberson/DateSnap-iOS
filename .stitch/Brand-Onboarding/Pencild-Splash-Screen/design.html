      filter: blur(48px);
    }

    /* Soft icon rim aura and elevation shadow */
    .icon-elevation {
      box-shadow:
        0 24px 50px -12px rgba(11, 12, 34, 0.9),
        0 18px 36px -10px rgba(255, 122, 0, 0.18),
        0 0 0 1px rgba(255, 255, 255, 0.08),
        inset 0 1px 1px 0 rgba(255, 255, 255, 0.25);
    }

    /* Discreet pulse for ultra-refined launch readiness indicator */
    @keyframes serenePulse {
      0%, 100% { opacity: 0.25; transform: scale(1); }
