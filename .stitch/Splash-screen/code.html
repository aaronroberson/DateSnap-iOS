<div class="flex items-center justify-center gap-1.5 w-full max-w-[360px] px-1 pointer-events-auto mb-4"><div class="flex-1 flex items-center justify-center gap-1 px-2.5 py-1.5 rounded-full bg-surface-container-low/80 border border-white/5 backdrop-blur-md shadow-sm whitespace-nowrap"><span class="material-symbols-outlined text-primary text-[13px]">document_scanner</span><span class="font-label-sm text-[11px] font-semibold tracking-tight text-on-surface">Instant OCR</span></div><div class="flex-1 flex items-center justify-center gap-1 px-2.5 py-1.5 rounded-full bg-surface-container-low/80 border border-white/5 backdrop-blur-md shadow-sm whitespace-nowrap"><span class="material-symbols-outlined text-secondary text-[13px]">auto_fix_high</span><span class="font-label-sm text-[11px] font-semibold tracking-tight text-on-surface">Apple Intelligence</span></div><div class="flex-1 flex items-center justify-center gap-1 px-2.5 py-1.5 rounded-full bg-surface-container-low/80 border border-white/5 backdrop-blur-md shadow-sm whitespace-nowrap"><span class="material-symbols-outlined text-tertiary text-[13px]">lock</span><span class="font-label-sm text-[11px] font-semibold tracking-tight text-on-surface">100% Private</span></div></div><div class="relative h-16 w-full max-w-[340px] rounded-full p-1.5 flex items-center bg-surface-container-high/60 backdrop-blur-2xl shadow-[0_16px_36px_-6px_rgba(0,0,0,0.7)] overflow-hidden" id="sliderTrack">

<script>
  (function () {
    const track = document.getElementById('sliderTrack');
    const knob = document.getElementById('sliderKnob');
    const label = document.getElementById('sliderLabel');
    const fill = document.getElementById('sliderFill');
    const icon = document.getElementById('knobIcon');

    if (!track || !knob) return;

    let isDragging = false;
    let startX = 0;
    let currentX = 0;
    let maxDistance = 0;

    function updateMaxDistance() {
      maxDistance = track.clientWidth - knob.clientWidth - 12; // padding offset
    }

    updateMaxDistance();
    window.addEventListener('resize', updateMaxDistance);

    function onStart(clientX) {
      isDragging = true;
      startX = clientX - currentX;
      knob.style.transition = 'none';
      if (fill) fill.style.transition = 'none';
    }

    function onMove(clientX) {
      if (!isDragging) return;
      let newX = clientX - startX;
      if (newX < 0) newX = 0;
      if (newX > maxDistance) newX = maxDistance;
      currentX = newX;

      knob.style.transform = `translateX(${currentX}px)`;
      if (fill) fill.style.width = `${currentX + knob.clientWidth}px`;

      // Dim label as slider moves
      const progress = currentX / maxDistance;
      if (label) {
        label.style.opacity = `${Math.max(0, 1 - progress * 1.5)}`;
      }
    }

    function onEnd() {
      if (!isDragging) return;
      isDragging = false;

      // Completion threshold 75%
      if (currentX > maxDistance * 0.75) {
        currentX = maxDistance;
        knob.style.transition = 'transform 200ms cubic-bezier(0.16, 1, 0.3, 1)';
        knob.style.transform = `translateX(${maxDistance}px)`;
        if (fill) {
          fill.style.transition = 'width 200ms ease-out';
          fill.style.width = '100%';
        }
        if (icon) {
          icon.textContent = 'check';
          icon.classList.add('scale-110');
        }

        // Haptic feedback if available
        if (window.navigator && window.navigator.vibrate) {
          window.navigator.vibrate([15, 30, 20]);
        }
        
        // Broadcast custom event or splash completion
        track.dispatchEvent(new CustomEvent('splash-completed', { bubbles: true }));
      } else {
        // Snap back reset
        currentX = 0;
        knob.style.transition = 'transform 300ms cubic-bezier(0.34, 1.56, 0.64, 1)';
        knob.style.transform = 'translateX(0px)';
        if (fill) {
          fill.style.transition = 'width 300ms ease-out';
          fill.style.width = '0px';
        }
        if (label) {
          label.style.opacity = '0.9';
        }
      }
    }

    // Touch Listeners
    knob.addEventListener('touchstart', (e) => {
      onStart(e.touches[0].clientX);
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (isDragging) onMove(e.touches[0].clientX);
    }, { passive: true });

    window.addEventListener('touchend', onEnd);
    window.addEventListener('touchcancel', onEnd);

    // Mouse Listeners
    knob.addEventListener('mousedown', (e) => {
      onStart(e.clientX);
    });

    window.addEventListener('mousemove', (e) => {
      if (isDragging) onMove(e.clientX);
    });

    window.addEventListener('mouseup', onEnd);
  })();
</script></main>
