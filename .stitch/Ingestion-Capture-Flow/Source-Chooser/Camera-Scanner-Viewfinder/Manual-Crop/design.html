  (function initPerspectiveTool() {
    const container = document.getElementById('workspaceContainer');
    const maskPoly = document.getElementById('maskPolygon');
    const cropOutline = document.getElementById('cropOutline');
    const loupe = document.getElementById('loupePreview');
    const loupeTarget = document.getElementById('loupeTarget');
    const tiltSlider = document.getElementById('tiltSlider');
    const keystoneAngle = document.getElementById('keystoneAngle');
    const autoStraightenBtn = document.getElementById('autoStraightenBtn');
    const rotateBtn = document.getElementById('rotateBtn');
    const gridToggleBtn = document.getElementById('gridToggleBtn');
    const gridMesh = document.getElementById('gridMesh');
    const imageLayer = document.getElementById('imageLayer');
    const resetCropBtn = document.getElementById('resetCropBtn');
    const confirmScanBtn = document.getElementById('confirmScanBtn');

    // Polygon corner coords relative to container px
    const defaultCoords = {
      tl: { x: 36, y: 44 },
      tr: { x: 280, y: 34 },
      br: { x: 310, y: 380 },
      bl: { x: 28, y: 360 }
    };
    let coords = { ...defaultCoords };
    let currentRotation = 0;
    let isGridVisible = true;

    function getMidpoint(p1, p2) {
      return { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
    }

    function renderCropPolygon() {
      const tc = getMidpoint(coords.tl, coords.tr);
      const mr = getMidpoint(coords.tr, coords.br);
      const bc = getMidpoint(coords.br, coords.bl);
      const ml = getMidpoint(coords.bl, coords.tl);

      const pts = `${coords.tl.x},${coords.tl.y} ${coords.tr.x},${coords.tr.y} ${coords.br.x},${coords.br.y} ${coords.bl.x},${coords.bl.y}`;
      maskPoly.setAttribute('points', pts);
      cropOutline.setAttribute('points', pts);

      // Position handle nodes
      const handles = {
        tl: coords.tl,
        tr: coords.tr,
        br: coords.br,
        bl: coords.bl,
        tc, mr, bc, ml
      };

      Object.keys(handles).forEach(k => {
        const el = document.getElementById(`handle-${k}`);
        if (el) {
          el.style.left = `${handles[k].x}px`;
          el.style.top = `${handles[k].y}px`;
        }
      });
    }

    // Interactive Dragging on workspace
    let activeKey = null;

    function handlePointerDown(e) {
      const target = e.target.closest('[data-handle]');
      if (!target) return;
      activeKey = target.getAttribute('data-handle');

      // Only show loupe for 4 main corners
      if (['tl', 'tr', 'br', 'bl'].includes(activeKey)) {
        loupe.classList.remove('scale-0', 'opacity-0');
        loupe.classList.add('scale-100', 'opacity-100');
        updateLoupe(coords[activeKey]);
      }
      e.preventDefault();
    }

    function updateLoupe(point) {
      if (!container) return;
      const rect = container.getBoundingClientRect();
      const pctX = (point.x / rect.width) * 100;
      const pctY = (point.y / rect.height) * 100;
      loupeTarget.style.left = `-${pctX * 2.2}%`;
      loupeTarget.style.top = `-${pctY * 2.2}%`;
    }

    function handlePointerMove(e) {
      if (!activeKey) return;
      const rect = container.getBoundingClientRect();
      let clientX = e.clientX;
      let clientY = e.clientY;
      if (e.touches && e.touches[0]) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      }
      let x = Math.max(10, Math.min(rect.width - 10, clientX - rect.left));
      let y = Math.max(10, Math.min(rect.height - 10, clientY - rect.top));

      if (['tl', 'tr', 'br', 'bl'].includes(activeKey)) {
        coords[activeKey] = { x, y };
        updateLoupe(coords[activeKey]);
      } else if (activeKey === 'tc') {
        coords.tl.y = y;
        coords.tr.y = y;
      } else if (activeKey === 'bc') {
        coords.bl.y = y;
        coords.br.y = y;
      } else if (activeKey === 'ml') {
        coords.tl.x = x;
        coords.bl.x = x;
      } else if (activeKey === 'mr') {
        coords.tr.x = x;
        coords.br.x = x;
      }
      renderCropPolygon();
    }

    function handlePointerUp() {
      if (activeKey) {
        activeKey = null;
        loupe.classList.remove('scale-100', 'opacity-100');
        loupe.classList.add('scale-0', 'opacity-0');
      }
    }

    container.addEventListener('mousedown', handlePointerDown);
    container.addEventListener('touchstart', handlePointerDown, { passive: false });
    window.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('touchmove', handlePointerMove, { passive: false });
    window.addEventListener('mouseup', handlePointerUp);
    window.addEventListener('touchend', handlePointerUp);

    // Filter Switcher
    const filterButtons = document.querySelectorAll('.filter-chip');
    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => {
          b.className = 'filter-chip shrink-0 px-3.5 py-1.5 rounded-full bg-surface-container text-on-surface-variant font-label-md text-label-md active:scale-95 transition-all hover:text-on-surface';
        });
        btn.className = 'filter-chip shrink-0 flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-primary-container text-on-primary font-label-md text-label-md shadow-lg shadow-primary-container/20 active:scale-95 transition-all';
        const type = btn.getAttribute('data-filter');
        if (type === 'bw') {
          imageLayer.style.filter = 'grayscale(1) contrast(1.4) brightness(1.05)';
        } else if (type === 'ocr') {
          imageLayer.style.filter = 'grayscale(1) contrast(2.2) brightness(1.15)';
        } else if (type === 'glare') {
          imageLayer.style.filter = 'contrast(1.08) brightness(1.02)';
        } else {
          imageLayer.style.filter = 'none';
        }
      });
    });

    // Slider Keystone adjustment
    tiltSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      keystoneAngle.textContent = `${val > 0 ? '+' : ''}${val.toFixed(1)}°`;
      imageLayer.style.transform = `rotate(${val + currentRotation}deg)`;
    });

    autoStraightenBtn.addEventListener('click', () => {
      tiltSlider.value = 0;
      keystoneAngle.textContent = '0.0°';
      imageLayer.style.transform = `rotate(${currentRotation}deg)`;
    });

    // Rotate 90
    rotateBtn.addEventListener('click', () => {
      currentRotation = (currentRotation + 90) % 360;
      const tilt = parseFloat(tiltSlider.value);
      imageLayer.style.transform = `rotate(${tilt + currentRotation}deg)`;
    });

    // Grid toggle
    gridToggleBtn.addEventListener('click', () => {
      isGridVisible = !isGridVisible;
      gridMesh.style.opacity = isGridVisible ? '1' : '0';
      gridToggleBtn.querySelector('span:last-child').textContent = isGridVisible ? 'Mesh ON' : 'Mesh OFF';
    });

    // Aspect Ratio options
    const aspectButtons = document.querySelectorAll('.aspect-btn');
    aspectButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        aspectButtons.forEach(b => {
          b.className = 'aspect-btn flex-1 py-1.5 rounded-md text-label-sm font-label-sm text-on-surface-variant hover:text-on-surface transition-colors';
        });
        btn.className = 'aspect-btn flex-1 py-1.5 rounded-md text-label-sm font-label-sm text-on-surface bg-surface-container-high font-semibold transition-colors';
        const r = btn.getAttribute('data-ratio');
        if (r === 'doc') {
          coords.tl = { x: 45, y: 30 };
          coords.tr = { x: 275, y: 30 };
          coords.br = { x: 275, y: 390 };
          coords.bl = { x: 45, y: 390 };
        } else if (r === '4:3') {
          coords.tl = { x: 30, y: 60 };
          coords.tr = { x: 290, y: 60 };
          coords.br = { x: 290, y: 320 };
          coords.bl = { x: 30, y: 320 };
        } else if (r === '16:9') {
          coords.tl = { x: 20, y: 100 };
          coords.tr = { x: 300, y: 100 };
          coords.br = { x: 300, y: 260 };
          coords.bl = { x: 20, y: 260 };
        }
        renderCropPolygon();
      });
    });

    // Reset crop action
    resetCropBtn.addEventListener('click', () => {
      coords = {
        tl: { x: 36, y: 44 },
        tr: { x: 280, y: 34 },
        br: { x: 310, y: 380 },
        bl: { x: 28, y: 360 }
      };
      tiltSlider.value = -1.8;
      keystoneAngle.textContent = '-1.8°';
      currentRotation = 0;
      imageLayer.style.transform = 'rotate(-1.8deg)';
      renderCropPolygon();
    });

    // Scan Confirmation micro-feedback
    confirmScanBtn.addEventListener('click', () => {
      confirmScanBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">sync</span><span>Neural Parsing...</span>';
      setTimeout(() => {
        confirmScanBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">done_all</span><span>Pencil\'d!</span>';
      }, 1200);
    });

    // Initial render
    renderCropPolygon();
  })();
</script></main></body></html>
