name: Pencild
options:
  xcodeVersion: "27.0"
  bundleIdPrefix: com.pencild
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  fileTypes:
    icon:
      file: true
  projectFormat: 77
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    OTHER_SWIFT_FLAGS: "-strict-concurrency=complete -warnings-as-errors"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    DEVELOPMENT_TEAM: WGKKDYY866
targets:
  Pencild:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Pencild
      - path: Assets.xcassets
        buildPhase: resources
      - path: Pencild.icon
        buildPhase: resources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Fonts
        buildPhase: resources
    configFiles:
      Debug: Config/Pencild-Debug.xcconfig
      Release: Config/Pencild-Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pencild.app
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Pencil'd"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        CODE_SIGN_ENTITLEMENTS: Pencild.entitlements
        CODE_SIGN_IDENTITY: "Apple Development"
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: WGKKDYY866
        ASSETCATALOG_COMPILER_APPICON_NAME: Pencild
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      storeKitConfiguration: Pencild.storekit
      testTargets:
        - PencildTests
  PencildTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/PencildTests
    dependencies:
      - target: Pencild
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pencild.app.tests
        GENERATE_INFOPLIST_FILE: YES
